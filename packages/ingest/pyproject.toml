[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munim-ingest"
version = "0.1.0"
description = "Statement ingestion for munim: pulls bank statement attachments from email into a local folder for munim to classify."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  # 0.16 is the oldest release verified to work here: earlier typer
  # (through 0.15.x) breaks against click >= 8.2 with
  # "TyperArgument.make_metavar() takes 1 positional argument but 2 were
  # given", which makes even `gmail fetch --help` fail.
  "typer>=0.16",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
munim-ingest = "munim_ingest.cli:app"

[tool.setuptools.packages.find]
include = ["munim_ingest*"]

[tool.setuptools.package-data]
munim_ingest = ["packs/*.yaml"]
