bank: hdfc
# hdfcbank.bank.in confirmed 2026-08-29 against a real HDFC credit card
# e-statement (sender: emailstatements.cards@hdfcbank.bank.in). The other
# two are unverified guesses, kept in case savings-account statements or
# other HDFC mail types use a different domain.
from_domains:
  - hdfcbank.bank.in
  - hdfcbank.net
  - hdfcbank.com
attachment_extensions:
  - .csv
  - .pdf
# Confirmed 2026-08-29 against a real subject line: "Your HDFC Bank -
# Regalia Gold Credit Card Statement - August-2026" — card name and month
# vary, "Credit Card Statement" doesn't. Without this, from_domains alone
# matched ~4700 messages over ~2.5 years (alerts/OTPs/offers, not just
# statements) on a real, actively-used account.
subject_keywords:
  - Credit Card Statement
