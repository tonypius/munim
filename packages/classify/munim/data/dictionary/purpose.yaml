# Purpose-tail dictionary — last-resort signal for UPI payments to
# individuals with no merchant/payee identity of their own (street
# vendors, drivers, etc.). Matched against the trailing purpose word in
# the raw narration (see Normalizer's `purpose` field), NOT the merchant
# name — patterns here are whitespace-free (spaces are stripped from both
# the input and these keys before comparing, since raw narrations often
# have a stray space inserted mid-word from PDF/line-wrap reconstruction:
# "fo od", "ta xi").
# Format: Category -> list of purpose keywords (uppercase, no spaces).

